<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>印 · Motion Canvas</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050f22;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #app canvas {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
      }
    </style>
    <script type="module" crossorigin src="./mc-player.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
